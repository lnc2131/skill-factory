[project]
name = "{{name}}"
version = "0.1.0"
description = "{{description}}"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3.0"]

[project.scripts]
{{name}} = "{{pkg}}:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
